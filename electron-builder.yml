appId: com.alexm.winnipegcanvass
productName: Winnipeg Canvass
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
linux:
  target:
    - AppImage
    - deb
  category: Utility
win:
  target:
    - portable
  # Avoid winCodeSign symlink extraction (needs Developer Mode / admin on Windows).
  signAndEditExecutable: false
